name: HugoerMobile
options:
  bundleIdPrefix: com.hugoer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.hugoer.mobile
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  HugoerMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HugoerMobile
      # Quill-based rich Markdown editor shared with Android; bundled as the `editor/` folder.
      - path: ../shared/web/editor
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Hugoer Mobile
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.2.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
      testTargets: []
